# 生产部署：cp .env.example .env 并填写 DJANGO_SECRET_KEY、MYSQL_PASSWORD、MYSQL_ROOT_PASSWORD、域名等，然后 make docker-up
services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petowner}
      MYSQL_USER: ${MYSQL_USER:-pawstay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: pawstay:latest
    env_file: .env
    environment: &app-env
      DJANGO_DEBUG: "false"
      DJANGO_TRUST_X_REAL_IP: "true"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-pawstay}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: pawstay:latest
    env_file: .env
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      [
        "sh",
        "-c",
        "while true; do python manage.py expire_orders; h=$$(date +%H); if [ \"$$h\" = \"20\" ]; then python manage.py send_care_digests; fi; sleep 300; done",
      ]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: mysql:8.4
    entrypoint: ["bash", "/backup.sh"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petowner}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/data/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  media:
