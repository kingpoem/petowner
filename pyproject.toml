[project]
name = "petowner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "django>=6.1.2",
    "fpdf2>=2.8.9",
    "gunicorn>=26.2.0 ; sys_platform != 'win32'",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "segno>=1.6.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
