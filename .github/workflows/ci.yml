name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ci-root
  MYSQL_DATABASE: petowner
  MYSQL_TEST_DATABASE: test_petowner

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: petowner
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --frozen
      - name: 代码检查
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Django 系统检查与迁移完整性
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: 部署安全检查
        run: uv run python scripts/deploy_check.py
      - name: 生产静态文件收集（指纹与压缩）
        run: uv run python manage.py collectstatic --noinput
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-collectstatic-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - name: 单元测试
        run: uv run python manage.py test apps --noinput

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建生产镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pawstay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 镜像冒烟测试
        run: |
          docker run --rm -e DJANGO_DEBUG=false -e DJANGO_SECRET_KEY=ci-smoke-${{ github.run_id }}-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            -e RUN_MIGRATIONS=0 pawstay:ci python manage.py check
      - name: 校验 compose 配置
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_PASSWORD=$/MYSQL_PASSWORD=ci/; s/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci/' .env
          docker compose config --quiet
