{% extends "base.html" %}

{% block content %}
{% with url_name=request.resolver_match.url_name %}
<div class="container py-4">
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="ps-card p-3 side-menu">
        <div class="d-flex align-items-center gap-3 p-2 mb-2">
          <span class="owner-avatar" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="56" height="56">
              <circle cx="48" cy="48" r="48" fill="#f2703f"/>
              <circle cx="48" cy="36" r="16" fill="#ffffff"/>
              <path fill="#ffffff" d="M16 82c4-18 18-28 32-28s28 10 32 28v2H16z"/>
            </svg>
          </span>
          <div class="min-w-0">
            <div class="fw-bold text-truncate">{{ request.owner.name }}</div>
            <div class="small text-muted text-truncate">{{ request.owner.phone }}</div>
          </div>
        </div>
        <div class="list-group list-group-flush">
          <a class="list-group-item list-group-item-action {% if url_name == 'dashboard' %}active{% endif %}" href="{% url 'web:dashboard' %}"><i class="bi bi-grid"></i>个人中心</a>
          <a class="list-group-item list-group-item-action {% if url_name|slice:':5' == 'order' %}active{% endif %}" href="{% url 'web:order_list' %}"><i class="bi bi-receipt"></i>我的订单</a>
          <a class="list-group-item list-group-item-action {% if url_name|slice:':3' == 'pet' or url_name == 'pet_health' %}active{% endif %}" href="{% url 'web:pet_list' %}"><i class="bi bi-heart"></i>我的宠物</a>
          <a class="list-group-item list-group-item-action {% if url_name == 'profile' or url_name == 'password_change' %}active{% endif %}" href="{% url 'web:profile' %}"><i class="bi bi-gear"></i>账号设置</a>
        </div>
      </div>
    </aside>
    <div class="col-lg-9">
      {% block main %}{% endblock %}
    </div>
  </div>
</div>
{% endwith %}
{% endblock %}
