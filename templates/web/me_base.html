{% extends "base.html" %}

{% block content %}
{% with url_name=request.resolver_match.url_name %}
<div class="container py-4">
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="ps-card p-3 side-menu">
        <div class="d-none d-lg-flex align-items-center gap-3 p-2 mb-2">
          <span class="brand-mark m-0" style="width:46px;height:46px;"><i class="bi bi-person"></i></span>
          <div>
            <div class="fw-bold">{{ request.owner.name }}</div>
            <div class="small text-muted">{{ request.owner.phone }}</div>
          </div>
        </div>
        <div class="list-group list-group-flush">
          <a class="list-group-item list-group-item-action {% if url_name == 'dashboard' %}active{% endif %}" href="{% url 'web:dashboard' %}"><i class="bi bi-grid"></i>功能概览</a>
          <a class="list-group-item list-group-item-action {% if url_name == 'profile' or url_name == 'password_change' %}active{% endif %}" href="{% url 'web:profile' %}"><i class="bi bi-person-vcard"></i>个人信息</a>
          <a class="list-group-item list-group-item-action {% if url_name|slice:':3' == 'pet' %}active{% endif %}" href="{% url 'web:pet_list' %}"><i class="bi bi-heart"></i>宠物登记</a>
          <a class="list-group-item list-group-item-action {% if url_name == 'room_list' or url_name == 'room_detail' or url_name == 'booking_create' %}active{% endif %}" href="{% url 'web:room_list' %}"><i class="bi bi-door-open"></i>房间查询</a>
          <a class="list-group-item list-group-item-action {% if url_name == 'order_list' or url_name == 'order_detail' or url_name == 'order_pay' %}active{% endif %}" href="{% url 'web:order_list' %}"><i class="bi bi-journal-text"></i>寄养记录</a>
          <a class="list-group-item list-group-item-action {% if url_name == 'review_list' or url_name == 'order_review' %}active{% endif %}" href="{% url 'web:review_list' %}"><i class="bi bi-star"></i>服务评价</a>
        </div>
      </div>
    </aside>
    <div class="col-lg-9">
      {% block main %}{% endblock %}
    </div>
  </div>
</div>
{% endwith %}
{% endblock %}
