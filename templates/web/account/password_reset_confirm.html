{% extends "base.html" %}

{% block title %}设置新密码{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrap ps-card p-4 p-md-5">
    {% if validlink %}
      <div class="text-center mb-4">
        <span class="brand-mark mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem;"><i class="bi bi-shield-lock"></i></span>
        <h1 class="h3">设置新密码</h1>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}{% include "web/_field.html" %}{% endfor %}
        <button class="btn btn-primary btn-lg w-100 mt-2">保存新密码</button>
      </form>
    {% else %}
      <div class="text-center">
        <i class="bi bi-link-45deg display-4 text-muted"></i>
        <h1 class="h4 mt-2">链接已失效</h1>
        <p class="text-muted small">重置链接只能使用一次且有有效期，请重新申请。</p>
        <a class="btn btn-primary" href="{% url 'web:password_reset' %}">重新获取链接</a>
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
