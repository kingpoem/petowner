{% extends "base.html" %}

{% block title %}找回密码{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrap ps-card p-4 p-md-5">
    <div class="text-center mb-4">
      <span class="brand-mark mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem;"><i class="bi bi-key"></i></span>
      <h1 class="h3">找回密码</h1>
      <p class="text-muted small">输入注册时填写的邮箱，我们会发送重置链接</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}{% include "web/_field.html" %}{% endfor %}
      <button class="btn btn-primary btn-lg w-100 mt-2">发送重置链接</button>
    </form>
    <p class="text-center small text-muted mt-4 mb-0">
      未绑定邮箱？可<a href="{% url 'web:password_reset_sms' %}">通过手机验证码找回</a>，或致电 <a href="tel:{{ SITE.phone }}">{{ SITE.phone }}</a><br>
      <a href="{% url 'web:login' %}">返回登录</a>
    </p>
  </div>
</div>
{% endblock %}
