{% extends "web/me_base.html" %}

{% block title %}修改密码{% endblock %}

{% block main %}
<div class="ps-card p-4" style="max-width: 560px;">
  <h4 class="mb-4">修改密码</h4>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "web/_field.html" %}{% endfor %}
    <div class="d-flex gap-2">
      <button class="btn btn-primary">确认修改</button>
      <a class="btn btn-light" href="{% url 'web:profile' %}">返回</a>
    </div>
  </form>
</div>
{% endblock %}
