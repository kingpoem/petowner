{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrap ps-card p-4 p-md-5 text-center">
    <span class="brand-mark mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem;"><i class="bi bi-{{ icon }}"></i></span>
    <h1 class="h3">{{ heading }}</h1>
    <p class="text-muted small mb-4">{{ body }}</p>
    {% if show_login %}
      <a class="btn btn-primary btn-lg w-100" href="{% url 'web:login' %}">去登录</a>
    {% else %}
      <a class="btn btn-light w-100" href="{% url 'web:home' %}">返回首页</a>
    {% endif %}
  </div>
</div>
{% endblock %}
