{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li><a class="ps-tool" href="{% url 'admin:bookings_order_available_rooms' %}">查空房开单</a></li>
  <li><a class="ps-tool" href="{% url 'admin:bookings_order_add' %}">录入订单</a></li>
  {{ block.super }}
{% endblock %}

{% block content %}
<div class="ps-order-help">
  <strong>订单状态：</strong>
  列表可按状态筛选；勾选后用底部动作完成
  <em>一键收款</em>、<em>办理入住</em>、<em>办理离店</em>、<em>取消预约</em>。
  点进订单可改房间/日期，并登记日常服务反馈。
</div>
{{ block.super }}
{% endblock %}
