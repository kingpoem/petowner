{% extends "admin/change_list.html" %}
{% load admin_list %}

{% block pagination %}
  <div class="changelist-footer">
    {% pagination cl %}
    {% if cl.formset and cl.result_count %}<input type="submit" name="_save" class="default" value="保存">{% endif %}
    <p class="order-ops-legend">
      收款：现金收款，含补差价。
      办理离店：完成寄养。
      取消预约：按取消政策退款。
      可用上方筛选查看今日入住或离店。
    </p>
  </div>
{% endblock %}
