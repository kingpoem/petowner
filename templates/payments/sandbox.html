{% extends "base.html" %}

{% block title %}确认支付{% endblock %}

{% block content %}
<div class="container">
  <div class="ps-card p-4 p-md-5 my-5 wrap-sm text-center">
    <span class="badge text-bg-warning mb-3"><i class="bi bi-cone-striped me-1"></i>演示收银台</span>
    <div class="text-muted small">订单 {{ order.order_no }} · 流水 {{ payment.transaction_no }}</div>
    <div class="display-6 fw-bold text-primary my-3">¥{{ payment.amount }}</div>
    <p class="text-muted">课程演示环境：点击下方按钮即完成支付入账，不会产生真实扣款。</p>
    <form method="post" class="d-grid gap-2">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ token }}">
      <button class="btn btn-primary btn-lg">确认支付</button>
    </form>
    <a class="small text-muted d-inline-block mt-3" href="{{ order.get_absolute_url }}">取消，返回订单</a>
  </div>
</div>
{% endblock %}
