{% extends "base.html" %}

{% block title %}模拟支付{% endblock %}

{% block content %}
<div class="container">
  <div class="ps-card p-4 p-md-5 my-5 wrap-sm text-center">
    <span class="badge text-bg-warning mb-3"><i class="bi bi-cone-striped me-1"></i>沙箱收银台</span>
    <div class="text-muted small">订单 {{ order.order_no }} · 流水 {{ payment.transaction_no }}</div>
    <div class="display-6 fw-bold text-primary my-3">¥{{ payment.amount }}</div>
    <p class="text-muted">模拟{% if payment.method == "wechat" %}微信{% else %}支付宝{% endif %}扫码支付。点击下方按钮即视为渠道异步通知成功入账。</p>
    <form method="post" class="d-grid gap-2">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ token }}">
      <button class="btn btn-primary btn-lg">模拟支付成功</button>
    </form>
    <a class="small text-muted d-inline-block mt-3" href="{{ order.get_absolute_url }}">取消，返回订单</a>
  </div>
</div>
{% endblock %}
